<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App | Node.JS Express.JS SQLite</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fanta.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <section id="auth">
      <div>
        <h2 className="sign-up-text">Login</h2>
        <p>Create an account!</p>
      </div>

      <p id="error" style="display: none"></p>
      <input id="emailInput" placeholder="Email" />
      <input id="passwordInput" placeholder="********" type="password" />
      <button id="authBtn" onclick="authenticate()">Submit</button>
      <hr />
      <div class="register-content">
        <p>Don&apos;t have an account?</p>
        <button onclick="toggleIsRegister()" id="registerBtn">Sign up</button>
      </div>
    </section>
    <header style="display: none">
      <h1 class="text-gradient">You have 0 open tasks.</h1>
    </header>
    <nav style="display: none" class="tab-container">
      <button onclick="changeTab('All')" class="tab-button selected-tab">
        <h4>All <span>(0)</span></h4>
      </button>
      <button onclick="changeTab('Open')" class="tab-button">
        <h4>Open <span>(0)</span></h4>
      </button>
      <button onclick="changeTab('Complete')" class="tab-button">
        <h4>Complete <span>(0)</span></h4>
      </button>
      <hr />
    </nav>
    <main style="display: none"></main>
  </body>
  <script>
    let token = localStorage.getItem("token");

    let isLoading = false;
    let isAuthenticating = false;
    let isRegistration = false;
    let selectedTab = "All";
    let todos = [];
    let editingId = null; // id of the todo whose edit form is open

    const apiBase = "/";

    // elements
    const nav = document.querySelector("nav");
    const header = document.querySelector("header");
    const main = document.querySelector("main");
    const navElements = document.querySelectorAll(".tab-button");
    const authContent = document.getElementById("auth");
    const textError = document.getElementById("error");
    const email = document.getElementById("emailInput");
    const password = document.getElementById("passwordInput");
    const registerBtn = document.getElementById("registerBtn");
    const authBtn = document.getElementById("authBtn");
    const addTodoBtn = document.getElementById("addTodoBtn");
    // const deleteBtn = document.getElementById('')
    // const updateBtn =

    // PAGE RENDERING LOGIC
    async function showDashboard() {
      nav.style.display = "block";
      header.style.display = "flex";
      main.style.display = "flex";
      authContent.style.display = "none";

      await fetchTodos();
    }

    function updateHeaderText() {
      const todosLength = todos.length;
      const newString =
        todos.length === 1
          ? `You have 1 open task.`
          : `You have ${todosLength} open tasks.`;
      header.querySelector("h1").innerText = newString;
    }

    function updateNavCount() {
      navElements.forEach((ele) => {
        const btnText = ele.innerText.split(" ")[0];

        // filter todos in here
        const count = todos.filter((val) => {
          if (btnText === "All") {
            return true;
          }
          return btnText === "Complete" ? val.completed : !val.completed;
        }).length;

        // target inside space and update value
        ele.querySelector("span").innerText = `(${count})`;
      });
    }

    function changeTab(tab) {
      selectedTab = tab;
      navElements.forEach((val) => {
        if (val.innerText.includes(tab)) {
          val.classList.add("selected-tab");
        } else {
          val.classList.remove("selected-tab");
        }
      });
      renderTodos();
    }

    // The browser's local date as YYYY-MM-DD
    function localToday() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${now.getFullYear()}-${month}-${day}`;
    }

    // Overdue: an open todo whose due date is before today. YYYY-MM-DD strings
    // compare correctly as plain strings.
    function isOverdue(todo) {
      return Boolean(todo.dueDate) && !todo.completed && todo.dueDate < localToday();
    }

    function renderTodos() {
      // need to add filtering logic in here

      updateNavCount();
      updateHeaderText();

      let todoList = ``;
      todos
        .filter((val) => {
          return selectedTab === "All"
            ? true
            : selectedTab === "Complete"
              ? val.completed
              : !val.completed;
        })
        .forEach((todo, todoIndex) => {
          const taskIndex = todo.id;
          const overdue = isOverdue(todo);
          const dueLine = todo.dueDate
            ? `<p class="todo-due">Due ${todo.dueDate}${overdue ? ' <span class="overdue-label">Overdue</span>' : ""}</p>`
            : "";
          if (taskIndex === editingId) {
            todoList += `
            <div class="card todo-item" onkeydown="editKeydown(event, ${taskIndex})">
                <input id="editTaskInput" aria-label="Task" />
                <input id="editDueDateInput" type="date" aria-label="Due date (optional)" />
                <div class="todo-buttons">
                    <button onclick="saveEdit(${taskIndex})">
                        <h6>Save</h6>
                    </button>
                    <button onclick="cancelEdit()">
                        <h6>Cancel</h6>
                    </button>
                </div>
            </div>
            `;
            return;
          }
          todoList += `
            <div class="card todo-item${overdue ? " todo-overdue" : ""}">
                <p>${todo.task}</p>
                ${dueLine}
                <div class="todo-buttons">
                    <button onclick="toggleTodo(${taskIndex})">
                        <h6>${todo.completed ? "Undo" : "Done"}</h6>
                    </button>
                    <button onclick="startEdit(${taskIndex})">
                        <h6>Edit</h6>
                    </button>
                    <button onclick="deleteTodo(${taskIndex})">
                        <h6>Delete</h6>
                    </button>
                </div>
            </div>
            `;
        });
      todoList += `
        <div class="input-container">
            <input id="todoInput" placeholder="Add task" />
            <input id="dueDateInput" type="date" aria-label="Due date (optional)" />
            <button onclick="addTodo()">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        `;
      main.innerHTML = todoList;
    }

    // showDashboard()

    // AUTH LOGIC

    async function toggleIsRegister() {
      isRegistration = !isRegistration;
      registerBtn.innerText = isRegistration ? "Sign in" : "Sign up";
      document.querySelector("#auth > div h2").innerText = isRegistration
        ? "Sign Up"
        : "Login";
      document.querySelector(".register-content p").innerText = isRegistration
        ? "Already have an account?"
        : "Don't have an account?";
      document.querySelector(".register-content button").innerText =
        isRegistration ? "Sign in" : "Sign up";
    }

    async function authenticate() {
      // access email and pass values
      const emailVal = email.value;
      const passVal = password.value;

      // guard clauses... if authenticating, return
      if (
        isLoading ||
        isAuthenticating ||
        !emailVal ||
        !passVal ||
        passVal.length < 6 ||
        !emailVal.includes("@")
      ) {
        return;
      }

      // reset error and set isAuthenticating to true
      error.style.display = "none";
      isAuthenticating = true;
      authBtn.innerText = "Authenticating...";

      try {
        let data;
        if (isRegistration) {
          // register an account
          const response = await fetch(apiBase + "auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: emailVal, password: passVal }),
          });
          data = await response.json();
        } else {
          // login an account
          const response = await fetch(apiBase + "auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: emailVal, password: passVal }),
          });
          data = await response.json();
        }

        if (data.token) {
          token = data.token;
          localStorage.setItem("token", token);

          // authenicating into loading
          authBtn.innerText = "Loading...";

          // fetch todos
          await fetchTodos();

          // show dashboard
          showDashboard();
        } else {
          // show the API's message (e.g. "Username already taken") when it sends one
          throw Error(data.message || "❌ Failed to authenticate...");
        }
      } catch (err) {
        console.log(err.message);
        error.innerText = err.message;
        error.style.display = "block";
      } finally {
        authBtn.innerText = "Submit";
        isAuthenticating = false;
      }
    }

    function logout() {
      // wipe states and clear cached token
    }

    // CRUD LOGIC

    async function fetchTodos() {
      isLoading = true;
      const response = await fetch(apiBase + "todos", {
        headers: { Authorization: `Bearer ${token}` },
      });
      const todosData = await response.json();
      todos = todosData;
      isLoading = false;
      renderTodos();
    }

    // Sends only the given fields; returns the fetch response
    function updateTodo(index, changes) {
      return fetch(apiBase + "todos" + "/" + index, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        body: JSON.stringify(changes),
      });
    }

    // Done ⇄ Undo
    async function toggleTodo(index) {
      const todo = todos.find((val) => val.id === index);
      await updateTodo(index, { completed: !todo.completed });
      fetchTodos();
    }

    // INLINE EDIT

    function startEdit(index) {
      editingId = index;
      renderTodos();
      // Set values via the DOM (not the template) so task text is used as-is
      const todo = todos.find((val) => val.id === index);
      const taskInput = document.getElementById("editTaskInput");
      taskInput.value = todo.task;
      document.getElementById("editDueDateInput").value = todo.dueDate ?? "";
      taskInput.focus();
    }

    function cancelEdit() {
      editingId = null;
      renderTodos();
    }

    function editKeydown(event, index) {
      // Only from the inputs: Enter on a focused button already fires its click
      if (event.key === "Enter" && event.target.tagName === "INPUT") saveEdit(index);
      if (event.key === "Escape") cancelEdit();
    }

    async function saveEdit(index) {
      const todo = todos.find((val) => val.id === index);
      const task = document.getElementById("editTaskInput").value;
      const dueDate = document.getElementById("editDueDateInput").value || null;

      // Send only what changed; an emptied date input clears the due date
      const changes = {};
      if (task.trim() !== todo.task) changes.task = task;
      if (dueDate !== todo.dueDate) changes.dueDate = dueDate;

      if (Object.keys(changes).length === 0) {
        cancelEdit();
        return;
      }

      const response = await updateTodo(index, changes);
      if (!response.ok) {
        // e.g. 400 for empty text: keep the form open
        return;
      }
      editingId = null;
      fetchTodos();
    }

    async function deleteTodo(index) {
      // set task complete status to true
      await fetch(apiBase + "todos" + "/" + index, {
        method: "DELETE",
        headers: {
          Authorization: `Bearer ${token}`,
        },
      });
      fetchTodos();
    }

    async function addTodo() {
      // have to access this val later as it's rendered with js
      const todoInput = document.getElementById("todoInput");
      const dueDateInput = document.getElementById("dueDateInput");
      const task = todoInput.value;
      const dueDate = dueDateInput.value;

      if (!task) {
        return;
      }

      const response = await fetch(apiBase + "todos", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        },
        // Omit dueDate when no date is picked
        body: JSON.stringify(dueDate ? { task, dueDate } : { task }),
      });
      if (!response.ok) {
        return;
      }
      todoInput.value = "";
      dueDateInput.value = "";
      fetchTodos();
    }

    // UTILITY FUNCTIONS

    // load page and read local storage for key

    // default to login screen

    // if is authenticated, show todo app
    if (token) {
      async function run() {
        await fetchTodos();
        showDashboard();
      }
      run();
    }
  </script>
</html>
